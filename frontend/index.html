<!doctype html>
<!-- This is the ONLY html file in the whole project.
     Notice the body has just one empty div with id="root".
     React fills that div with everything you see on screen.
     That is why this is called a "Single Page Application" (SPA):
     one HTML page, and JavaScript changes what is shown inside it. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TestForge — Interactive Exam Portal</title>
    <!-- Bootstrap is a ready-made CSS library. Loading it from the
         internet (CDN) gives us nice-looking buttons, tables and forms
         without writing much CSS ourselves. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
